<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 500px; background-color: white;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>#my-svg{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;font-size:15px;fill:#1d1d1f;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#fafafc;}#my-svg .error-text{fill:#050503;stroke:#050503;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#333333;stroke:#333333;}#my-svg .marker.cross{stroke:#333333;}#my-svg svg{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;font-size:15px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#0d9488;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#0d9488;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="45" width="232" height="212" fill="#e6f6f4"/><text x="0" y="0" fill="#1d1d1f" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 50) rotate(0)">エンタープライズ</text></g><g class="quadrant"><rect x="31" y="45" width="232" height="212" fill="#fafafc"/><text x="0" y="0" fill="#18181a" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 50) rotate(0)">コスパ型・大規模</text></g><g class="quadrant"><rect x="31" y="257" width="232" height="212" fill="#f5f5f7"/><text x="0" y="0" fill="#131315" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 262) rotate(0)">自社の狙うポジション</text></g><g class="quadrant"><rect x="263" y="257" width="232" height="212" fill="#ffffff"/><text x="0" y="0" fill="#0e0e10" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 262) rotate(0)">ニッチ特化</text></g></g><g class="border"><line x1="30" y1="45" x2="496" y2="45" style="stroke: rgb(13, 148, 136); stroke-width: 2;"/><line x1="495" y1="46" x2="495" y2="468" style="stroke: rgb(13, 148, 136); stroke-width: 2;"/><line x1="30" y1="469" x2="496" y2="469" style="stroke: rgb(13, 148, 136); stroke-width: 2;"/><line x1="31" y1="46" x2="31" y2="468" style="stroke: rgb(13, 148, 136); stroke-width: 2;"/><line x1="263" y1="46" x2="263" y2="468" style="stroke: rgb(13, 148, 136); stroke-width: 1;"/><line x1="32" y1="257" x2="494" y2="257" style="stroke: rgb(13, 148, 136); stroke-width: 1;"/></g><g class="data-points"><g class="data-point"><circle cx="54.2" cy="426.6" r="5" fill="#0d9488" stroke="#0d9488" stroke-width="0px"/><text x="0" y="0" fill="#1d1d1f" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(54.2, 431.6) rotate(0)">Excel 運用</text></g><g class="data-point"><circle cx="123.8" cy="384.20000000000005" r="5" fill="#0d9488" stroke="#0d9488" stroke-width="0px"/><text x="0" y="0" fill="#1d1d1f" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(123.8, 389.20000000000005) rotate(0)">サービス B</text></g><g class="data-point"><circle cx="402.2" cy="151" r="5" fill="#0d9488" stroke="#0d9488" stroke-width="0px"/><text x="0" y="0" fill="#1d1d1f" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(402.2, 156) rotate(0)">サービス A</text></g><g class="data-point"><circle cx="147" cy="320.6" r="5" fill="#0d9488" stroke="#0d9488" stroke-width="0px"/><text x="0" y="0" fill="#1d1d1f" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 325.6) rotate(0)">自社・予定</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#1d1d1f" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">低価格</text></g><g class="label"><text x="0" y="0" fill="#1d1d1f" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">高価格</text></g><g class="label"><text x="0" y="0" fill="#1d1d1f" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 363) rotate(-90)">小規模向け</text></g><g class="label"><text x="0" y="0" fill="#1d1d1f" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 151) rotate(-90)">大規模向け</text></g></g><g class="title"><text x="0" y