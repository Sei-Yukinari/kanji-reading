# 2 年生の問題データ原稿
# - 読みは「音訓の段階別割り振り表」の小学校で扱う音訓を収録(人手チェック前)
# - 読みの表記: 送り仮名は "のぼ(る)" の形で書く
# - exclude: 出題しないが正しい読み(常用漢字表の残りの音訓。中学校以降で習うものを含む)。単漢字問題の誤答に使わないための除外リスト(人手チェック前)
# - 熟語・例文: 出題漢字を例文では [ ] で囲む。未習漢字(3 年生以降)は {漢字|かな} でルビを付ける
# - 単漢字問題と誤答は生成スクリプトが作る。熟語・例文の誤答はここに書く
