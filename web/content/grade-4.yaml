# 4 年生の問題データ原稿
# - 読みは「音訓の段階別割り振り表」の小学校で扱う音訓を収録(人手チェック前)
# - 読みの表記: 送り仮名は "のぼ(る)" の形で書く
# - exclude: 出題しないが正しい読み(常用漢字表の残りの音訓。中学校・高校で習うものを含む)。人手チェック用の参考情報(人手チェック前)
# - 都道府県名の漢字(茨・媛・岡・潟・岐・熊・香・佐・埼・崎・滋・鹿・縄・井・沖・栃・奈・梨・阪・阜)は都道府県名で使う読みを中心に収録
# - 熟語・例文: 出題漢字を例文では [ ] で囲む。未習漢字(5 年生以上)は {漢字|かな} でルビを付ける
# - 問題は熟語・例文のみ(単漢字問題は出題しない)。すべての読みに 1 問以上、すべての漢字に熟語 2 つ以上を置く。誤答はここに書く
