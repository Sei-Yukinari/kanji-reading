# 1 年生の問題データ原稿(MVP 版)
# - 読みは「音訓の段階別割り振り表」の小学校で扱う音訓から、MVP で出題する主な読みを収録(人手チェック前)
# - 読みの表記: 送り仮名は "のぼ(る)" の形で書く
# - 熟語・例文: 出題漢字を例文では [ ] で囲む。未習漢字は {漢字|かな} でルビを付ける
# - 単漢字問題と誤答は生成スクリプトが作る。熟語・例文の誤答はここに書く
