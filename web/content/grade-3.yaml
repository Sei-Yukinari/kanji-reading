# 3 年生の問題データ原稿
# - 読みは「音訓の段階別割り振り表」の小学校で扱う音訓を収録(人手チェック前)
# - 読みの表記: 送り仮名は "のぼ(る)" の形で書く
# - 語幹が同じ自動詞・他動詞の組(例: 育つ / 育てる)は 1 年生原稿にならい、代表の 1 つを readings に入れ、残りは exclude に入れる
# - exclude: 出題しないが正しい読み(常用漢字表の残りの音訓。中学校・高校で習うものを含む)。単漢字問題の誤答に使わないための除外リスト(人手チェック前)
# - 熟語・例文: 出題漢字を例文では [ ] で囲む。未習漢字(4 年生以上)は {漢字|かな} でルビを付ける
# - 単漢字問題と誤答は生成スクリプトが作る。熟語・例文の誤答はここに書く
